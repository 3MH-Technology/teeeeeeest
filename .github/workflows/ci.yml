name: Wolf Host CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Lint and Build
      run: |
        npm run lint
        npm run build
      env:
        DATABASE_URL: postgresql://wolf:secretpassword@localhost:5432/wolfhosting
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: temporary_secret_for_build
        ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
